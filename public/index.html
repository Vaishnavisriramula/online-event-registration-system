<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Online Event Registration System</title>
</head>
<body>

    <h1>Online Event Registration System</h1>
    <h2>Student Registration</h2>
<form id="studentSignupForm">
    <input type="text" id="signupName" placeholder="Student Name" required>
    <input type="email" id="signupEmail" placeholder="Email Address" required>
    <input type="password" id="signupPassword" placeholder="Password" minlength="6" required>
    <button type="submit">Sign Up</button>
</form>

<h2>Student Login</h2>
<form id="studentLoginForm">
    <input type="email" id="loginEmail" placeholder="Email Address" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<p id="authMessage"></p>

    <h2>Create New Event</h2>
    <form id="eventForm">
        <input type="text" id="eventName" placeholder="Event Name" required>
        <input type="date" id="eventDate" required>
        <input type="text" id="eventLocation" placeholder="Location" required>
        <button type="submit">Add Event</button>
    </form>

    <h2>Available Events</h2>
    <div id="eventList"></div>

    <h2>Register for an Event</h2>
    <form id="registrationForm">
        <input type="text" id="studentName" placeholder="Your Name" required>
        <input type="email" id="studentEmail" placeholder="Your Email" required>

        <select id="eventSelect" required>
            <option value="">Select Event</option>
        </select>

        <button type="submit">Register</button>
    </form>

    <h2>Registered Participants</h2>
    <div id="registrationList"></div>

    <p id="message"></p>

    <script src="script.js"></script>
</body>
</html>
